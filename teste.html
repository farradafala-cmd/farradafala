<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FonoGame - Consciência Fonológica</title>
    <style>
        :root {
            --primary: #6c5ce7;
            --success: #00b894;
            --bg: #fff4b8;
            --error: #ff7675;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
            padding: 20px;
        }

        header h1 {
            font-size: 18px;
            margin: 6px 0;
            color: #333;
        }

        header p {
            font-size: 16px;
            margin: 8px 0 0;
            color: #444;
        }

        .splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #ffe680 0%, #fff8d6 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            animation: fadeOut 0.5s ease-in-out 2.5s forwards;
        }

        .splash-content {
            text-align: center;
            animation: bounce 1s ease-in-out;
        }

        .splash-content h1 {
            font-size: 3rem;
            margin-bottom: 1rem;
            animation: slideInLeft 0.8s ease-out;
            color: #5a4a00;
        }

        .splash-content p {
            font-size: 1.2rem;
            opacity: 0;
            animation: fadeInUp 0.8s ease-out 0.5s forwards;
            color: #6b5b00;
        }

        .splash-emoji {
            font-size: 5rem;
            animation: spin 1s ease-in-out;
        }

        .splash-img {
            max-width: 100%;
            height: auto;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        @keyframes slideInLeft {
            from {
                transform: translateX(-100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        @keyframes fadeInUp {
            from {
                transform: translateY(30px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        @keyframes fadeOut {
            to {
                opacity: 0;
                visibility: hidden;
            }
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes fadeInGame {
            to {
                opacity: 1;
            }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        .game-container {
            background: white;
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.12);
            text-align: center;
            width: 90%;
            max-width: 560px;
            opacity: 0;
            animation: fadeInGame 0.5s ease-in-out 2.8s forwards;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
        }

        .image-section {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
        }

        #word-image {
            font-size: 5rem;
            cursor: pointer;
            transition: transform 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 90px;
        }

        #word-image:hover {
            transform: scale(1.1);
        }

        .word-display {
            font-size: 3rem;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            width: 100%;
            flex-wrap: wrap;
            min-height: 90px;
        }

        .word-letter {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            min-width: 28px;
            color: #333;
        }

        .drop-zone {
            width: 60px;
            height: 80px;
            border: 3px dashed #ccc;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ccc;
            transition: all 0.3s;
            background-color: #fff;
        }

        .drop-zone.hover {
            border-color: var(--primary);
            background: #eee;
        }

        .drop-zone.correct {
            border-color: var(--success);
            color: var(--success);
            background: #e8f8f5;
        }

        .options {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 10px;
            flex-wrap: wrap;
            width: 100%;
        }

        .letter-card {
            width: 50px;
            height: 60px;
            background: var(--primary);
            color: white;
            font-size: 1.5rem;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 8px;
            cursor: grab;
            transition: transform 0.2s, background 0.3s, color 0.3s, border 0.3s;
            user-select: none;
        }

        .letter-card:hover {
            transform: scale(1.1);
            background: #ffffff;
            color: var(--primary);
            border: 2px solid var(--primary);
        }

        .letter-card:active {
            cursor: grabbing;
        }

        .feedback {
            margin-top: 5px;
            padding: 10px;
            border-radius: 10px;
            font-size: 0.95rem;
            animation: fadeInUp 0.3s ease-out;
            width: 100%;
            max-width: 420px;
        }

        .feedback.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .feedback.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .hidden {
            display: none;
        }

        button {
            margin-top: 10px;
            padding: 12px 28px;
            background: var(--success);
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-size: 1.05rem;
            transition: transform 0.2s;
        }

        button:hover {
            transform: scale(1.05);
        }

        #next-btn {
            align-self: center;
        }

        @media (max-width: 600px) {
            .game-container {
                padding: 1.5rem;
            }

            .word-display {
                font-size: 2.4rem;
            }

            .drop-zone {
                width: 52px;
                height: 70px;
            }

            #word-image {
                font-size: 4.2rem;
            }
        }
    </style>
</head>
<body>

    <div class="splash-screen" id="splashScreen">
        <div class="splash-content">
            <div class="splash-emoji">
                <img src="titulo.png" width="500" alt="FonoGame" class="splash-img">
            </div>
            <h1>FonoGame</h1>
            <p>Preparando as palavras mágicas...</p>
            <p style="font-size: 0.9rem; margin-top: 20px;">CONSCIÊNCIA FONOLÓGICA E SONS FONÊMICOS</p>
        </div>
    </div>

    <div class="game-container" id="A-FARRA-DA-FALA">
        <header>
            <h1>A ARARA LARA ESTÁ TROCANDO O SOM DAS PALAVRINHAS.</h1>
            <h1>AJUDE A LARA A ENCONTRAR A LETRA CERTA PARA COMPLETAR AS PALAVRINHAS ABAIXO.</h1>
            <p>🎵 CLIQUE NA IMAGEM PARA OUVIR O SOM. 🎵</p>
        </header>

        <div class="image-section">
            <div id="word-image" title="Clique para ouvir o som!">🌙</div>
        </div>

        <div id="word-display" class="word-display"></div>

        <div id="options-container" class="options"></div>
        <div id="feedback" class="feedback hidden"></div>

        <button id="next-btn" class="hidden">Próxima Palavra</button>
    </div>

    <script>
        const wordData = [
            {
                image: "🌙",
                palavraCompleta: "LUA",
                prefix: "",
                suffix: "UA",
                correct: "L",
                options: ["L", "R", "B"],
                audioText: "lua"
            },
            {
                image: "💬",
                palavraCompleta: "FALA",
                prefix: "",
                suffix: "ALA",
                correct: "F",
                options: ["B", "F", "C"],
                audioText: "fala"
            },
            {
                image: "🛣️",
                palavraCompleta: "RUA",
                prefix: "",
                suffix: "UA",
                correct: "R",
                options: ["T", "P", "R"],
                audioText: "rua"
            },
            {
                image: "👆",
                palavraCompleta: "DEDO",
                structure: ["", "E", "", "O"],
                correct: ["D", "D"],
                options: ["T", "D", "P"],
                audioText: "dedo"
            },
            {
                image: "🐸",
                palavraCompleta: "SAPO",
                prefix: "",
                suffix: "APO",
                correct: "S",
                options: ["X", "P", "S"],
                audioText: "sapo"
            },
            {
                image: "🎲",
                palavraCompleta: "DADO",
                structure: ["", "A", "", "O"],
                correct: ["D", "D"],
                options: ["P", "D", "T"],
                audioText: "dado"
            },
            {
                image: "🔪",
                palavraCompleta: "FACA",
                prefix: "",
                suffix: "ACA",
                correct: "F",
                options: ["V", "C", "F"],
                audioText: "faca"
            },
            {
                image: "🚣",
                palavraCompleta: "BOTE",
                prefix: "",
                suffix: "OTE",
                correct: "B",
                options: ["P", "B", "T"],
                audioText: "bote"
            },
            {
                image: "🦆",
                palavraCompleta: "PATO",
                prefix: "",
                suffix: "ATO",
                correct: "P",
                options: ["P", "B", "T"],
                audioText: "pato"
            },
            {
                image: "🐈",
                palavraCompleta: "GATO",
                prefix: "",
                suffix: "ATO",
                correct: "G",
                options: ["G", "C", "P"],
                audioText: "gato"
            }
        ];

        let currentIndex = 0;
        const synth = window.speechSynthesis;

        const wordDisplay = document.getElementById('word-display');
        const optionsContainer = document.getElementById('options-container');
        const nextBtn = document.getElementById('next-btn');
        const wordImage = document.getElementById('word-image');
        const feedbackDiv = document.getElementById('feedback');

        function speakWord(text) {
            if (synth.speaking) {
                synth.cancel();
            }

            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'pt-BR';
            utterance.rate = 0.9;
            utterance.pitch = 1.1;
            utterance.volume = 1;

            const voices = synth.getVoices();
            const brazilianVoice = voices.find(
                voice => voice.lang === 'pt-BR' && voice.name.toLowerCase().includes('google')
            );

            if (brazilianVoice) {
                utterance.voice = brazilianVoice;
            }

            synth.speak(utterance);
        }

        function showFeedback(message, type) {
            feedbackDiv.textContent = message;
            feedbackDiv.className = `feedback ${type}`;
            feedbackDiv.classList.remove('hidden');

            setTimeout(() => {
                feedbackDiv.classList.add('hidden');
            }, 2000);
        }

        function playWordSound() {
            const data = wordData[currentIndex];
            speakWord(data.audioText);
            showFeedback(`🔊 Ouvindo: "${data.palavraCompleta}"`, 'success');
        }

        function createDropZone() {
            const zone = document.createElement('div');
            zone.classList.add('drop-zone');
            zone.innerText = "?";

            zone.addEventListener('dragover', (e) => {
                e.preventDefault();
                zone.classList.add('hover');
            });

            zone.addEventListener('dragleave', () => {
                zone.classList.remove('hover');
            });

            zone.addEventListener('drop', (e) => {
                e.preventDefault();
                zone.classList.remove('hover');
                const droppedLetter = e.dataTransfer.getData('text/plain');
                checkLetter(droppedLetter);
            });

            return zone;
        }

        function addLetterSpan(text) {
            if (text === "") return;
            const span = document.createElement('span');
            span.classList.add('word-letter');
            span.innerText = text;
            wordDisplay.appendChild(span);
        }

        function initGame() {
            const data = wordData[currentIndex];

            wordImage.innerText = data.image;
            wordDisplay.innerHTML = '';
            optionsContainer.innerHTML = '';
            feedbackDiv.classList.add('hidden');
            nextBtn.classList.add('hidden');

            if (data.structure) {
                data.structure.forEach((item) => {
                    if (item === "") {
                        wordDisplay.appendChild(createDropZone());
                    } else {
                        addLetterSpan(item);
                    }
                });
            } else {
                addLetterSpan(data.prefix || "");
                wordDisplay.appendChild(createDropZone());
                addLetterSpan(data.suffix || "");
            }

            data.options.forEach((letra) => {
                const btn = document.createElement('div');
                btn.classList.add('letter-card');
                btn.innerText = letra;
                btn.draggable = true;

                btn.addEventListener('dragstart', (e) => {
                    e.dataTransfer.setData('text/plain', letra);
                    e.target.style.opacity = '0.5';
                });

                btn.addEventListener('dragend', (e) => {
                    e.target.style.opacity = '1';
                });

                btn.addEventListener('click', () => {
                    checkLetter(letra);
                });

                optionsContainer.appendChild(btn);
            });
        }

        function fillCorrectAnswer(data, letter) {
            const dropZones = document.querySelectorAll('.drop-zone');

            if (Array.isArray(data.correct)) {
                dropZones.forEach((zone, index) => {
                    zone.innerText = data.correct[index];
                    zone.classList.add('correct');
                    zone.style.borderColor = "var(--success)";
                    zone.style.color = "var(--success)";
                });
            } else {
                dropZones.forEach((zone) => {
                    zone.innerText = letter;
                    zone.classList.add('correct');
                    zone.style.borderColor = "var(--success)";
                    zone.style.color = "var(--success)";
                });
            }
        }

        function shakeAllDropZones() {
            const dropZones = document.querySelectorAll('.drop-zone');

            dropZones.forEach((zone) => {
                zone.style.animation = 'shake 0.3s ease-in-out';
                setTimeout(() => {
                    zone.style.animation = '';
                }, 300);
            });
        }

        function checkLetter(letter) {
            const data = wordData[currentIndex];
            let isCorrect = false;

            if (Array.isArray(data.correct)) {
                isCorrect = data.correct.every((correctLetter) => correctLetter === letter);
            } else {
                isCorrect = data.correct === letter;
            }

            if (isCorrect) {
                fillCorrectAnswer(data, letter);

                speakWord("Muito bem!");
                showFeedback("🎉 Muito bem! Lara está feliz! 🎉", 'success');

                setTimeout(() => {
                    speakWord(data.palavraCompleta);
                }, 500);

                nextBtn.classList.remove('hidden');
            } else {
                showFeedback("❌ Quase lá! Tente ouvir o som da palavra novamente. ❌", 'error');
                speakWord("Tente novamente");
                shakeAllDropZones();
            }
        }

        wordImage.addEventListener('click', playWordSound);

        nextBtn.addEventListener('click', () => {
            currentIndex = (currentIndex + 1) % wordData.length;
            initGame();
            showFeedback("✨ Nova palavra! Clique na imagem para ouvir o som! ✨", 'success');
        });

        if (synth.getVoices().length === 0) {
            synth.addEventListener('voiceschanged', () => {
                console.log('Vozes carregadas');
            });
        }

        setTimeout(() => {
            initGame();
        }, 2800);
    </script>
</body>
</html>
